<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanse</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="wrapper">
        <header>
            <h1>Dziennik wydatków</h1>
        </header>
        <nav>
            <a href="{{ url_for('index')}}" class="navButton">Strona główna</a>
            <a href="{{ url_for('add')}}" class="navButton">Dodaj rekord</a>
            <a href="{{ url_for('stats')}}" class="navButton">Statystyki</a>
            <a href="{{ url_for('report')}}" class="navButton">Generuj raport</a>
            <a href="{{ url_for('login')}}" class="navButton">Zmień użytkownika</a>
            <a href="{{ url_for('manageUsers')}}" class="navButton">Zarządzaj użytkownikami</a>
        </nav>
        <main>
            <div class="dataInput">
                <form action="" method="POST">
                    <input type="text" name="name" placeholder="Nazwa" required>
                    <select name="category" id="category">
                        {% for category in categories %}
                            <option value={{ category.id }}> {{ category.name }}</option>
                        {% endfor %}
                    </select>
                    <input type="number" name="amount" placeholder="Kwota" min="0" step="0.01" required>
                    <input type="text" name="comment" placeholder="Komentarz">
                    <input type="date" name="date">
                    <input type="checkbox" name="privExpense" value="1">
                    <input type="submit" value="Potwierdź">
                </form>
            </div>
        </main>
        <section>
        </section>
        <footer>
            <h5>Zalogowano jako: {{ user }}</h5>
        </footer>
    </div>
</body>
</html>
